[project]
name = "trading_agents"
version = "0.1.0"
description = "TradingAgents using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "aisuite>=0.1.6",
    "crewai[tools]==1.14.5a2",
    "duckdb>=1.5.2",
    "exa-py>=2.13.0",
    "markdown>=3.10.2",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "parsel>=1.11.0",
    "pydantic[email,timezone]>=2.12.5",
    "python-dotenv>=1.2.2",
    "questionary>=2.1.1",
    "redis>=7.4.0",
    "regex>=2026.1.15",
    "seaborn>=0.13.2",
    "stockstats>=0.6.8",
    "yfinance>=1.3.0",
]

[project.scripts]
kickoff = "trading_agents.main:kickoff"
run_crew = "trading_agents.main:kickoff"
plot = "trading_agents.main:plot"
run_with_trigger = "trading_agents.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
