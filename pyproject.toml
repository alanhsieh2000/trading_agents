[project]
name = "trading-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aisuite>=0.1.6",
    "crewai[anthropic,azure-ai-inference,google-genai,tools]>=1.15.5",
    "duckdb>=1.5.2",
    "exa-py>=2.13.0",
    "markdown>=3.10.2",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "parsel>=1.11.0",
    "pydantic[email,timezone]>=2.12.5",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "questionary>=2.1.1",
    "redis>=7.4.0",
    "regex>=2026.1.15",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "stockstats>=0.6.8",
    "yfinance>=1.3.0",
]

[project.scripts]
kickoff = "trading_agents.main:kickoff_cli"
plot = "trading_agents.main:plot"
run_with_trigger = "trading_agents.main:run_with_trigger_cli"
analyze = "trading_agents.main:analyze_cli"
scan-reddit-coverage = "trading_agents.evaluation.reddit_coverage:main"
scan-stocktwits-coverage = "trading_agents.evaluation.stocktwits_coverage:main"
build-eval-dataset = "trading_agents.evaluation.build_dataset:main"
build-plan-b-eval-dataset = "trading_agents.evaluation.build_dataset:plan_b_main"
patch-eval-reddit-arctic-shift = "trading_agents.evaluation.arctic_shift_patch:main"
run-eval = "trading_agents.evaluation.run_eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_agents"]

[tool.crewai]
type = "flow"
