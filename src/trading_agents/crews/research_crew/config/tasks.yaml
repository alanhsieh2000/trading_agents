bull_research:
  name: bull_research
  description: |
    Your task is to build a strong, evidence-based case emphasizing growth potential, competitive advantages, and positive market indicators.

    Key points to focus on:
    - Growth Potential: Highlight the company's market opportunities, revenue projections, and scalability.
    - Competitive Advantages: Emphasize factors like unique products, strong branding, or dominant market positioning.
    - Positive Indicators: Use financial health, industry trends, and recent positive news as evidence.
    - Bear Counterpoints: Critically analyze the bear argument with specific data and sound reasoning, addressing concerns thoroughly and showing why the bull perspective holds stronger merit.
    - Engagement: Present your argument in a conversational style, engaging directly with the bear analyst's points and debating effectively rather than just listing data.

    Resources available:
    Market research report: {market_report}
    Social media sentiment report: {sentiment_report}
    Latest world affairs news: {news_report}
    {fundamentals_label}: {fundamentals_report}
    Conversation history of the debate: {history}
    Last bear argument: {current_response}
  expected_output: >
    Use this information to deliver a compelling bull argument, refute the bear's
    concerns, and engage in a dynamic debate that demonstrates the strengths of the
    bull position.
  agent: bull_researcher
  markdown: true

bear_research:
  name: bear_research
  description: |
    Your goal is to present a well-reasoned argument emphasizing risks, challenges, and negative indicators.

    Key points to focus on:

    - Risks and Challenges: Highlight factors like market saturation, financial instability, or macroeconomic threats that could hinder the stock's performance.
    - Competitive Weaknesses: Emphasize vulnerabilities such as weaker market positioning, declining innovation, or threats from competitors.
    - Negative Indicators: Use evidence from financial data, market trends, or recent adverse news to support your position.
    - Bull Counterpoints: Critically analyze the bull argument with specific data and sound reasoning, exposing weaknesses or over-optimistic assumptions.
    - Engagement: Present your argument in a conversational style, directly engaging with the bull analyst's points and debating effectively rather than simply listing facts.

    Resources available:

    Market research report: {market_report}
    Social media sentiment report: {sentiment_report}
    Latest world affairs news: {news_report}
    {fundamentals_label}: {fundamentals_report}
    Conversation history of the debate: {history}
    Last bull argument: {current_response}
  expected_output: >
    Use this information to deliver a compelling bear argument, refute the bull's
    claims, and engage in a dynamic debate that demonstrates the risks and
    weaknesses of investing in the {ticker}.
  agent: bear_researcher
  markdown: true

research_management:
  name: research_management
  description: |
    Produce a structured investment plan. Use only evidence present in the debate transcript. Do not invent missing support.

    **Debate History:**
    {history}
  expected_output: |
    Return an InvestmentPlan object with:
    - recommendation: exactly one of Buy, Overweight, Hold, Underweight, Sell
    - rationale: a conversational summary of the key points from both sides of the debate, ending with which arguments led to the recommendation
    - strategic_actions: concrete steps for the trader to implement the recommendation, including position sizing guidance consistent with the rating

    **Rating Scale** (use exactly one):
    - **Buy**: Strong conviction in the bull thesis; recommend taking or growing the position
    - **Overweight**: Constructive view; recommend gradually increasing exposure
    - **Hold**: Balanced view; recommend maintaining the current position
    - **Underweight**: Cautious view; recommend trimming exposure
    - **Sell**: Strong conviction in the bear thesis; recommend exiting or avoiding the position

    Commit to a clear stance whenever the debate's strongest arguments warrant one; reserve Hold for situations where the evidence on both sides is genuinely balanced.
  agent: research_manager
  markdown: true
