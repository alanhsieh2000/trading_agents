    Use all four analyst reports plus the current debate transcript.

    <market_report>
    {market_report}
    </market_report>

    <sentiment_report>
    {sentiment_report}
    </sentiment_report>

    <news_report>
    {news_report}
    </news_report>

    <fundamentals_report>
    {fundamentals_report}
    </fundamentals_report>

