  markdown: true

research_management:
  name: research_management
  description: |
    Review the four analyst reports and the full debate transcript for {ticker}.

    <market_report>
    {market_report}
    </market_report>

    <sentiment_report>
    {sentiment_report}
    </sentiment_report>

    <news_report>
    {news_report}
    </news_report>

    <fundamentals_report>
    {fundamentals_report}
    </fundamentals_report>

    <debate_history>
    {debate_history}
    </debate_history>

    Produce a structured investment plan. Use only evidence present in the analyst
    reports or the debate transcript. Do not invent missing support.
  expected_output: |
    Return an investment plan with:
    - rating: one of Buy, Overweight, Hold, Underweight, Sell
    - thesis: a concise investment thesis
    - supporting_evidence: a list of concrete evidence points
    - key_risks: a list of concrete risks
    - recommended_action: a clear next action for the trading stage
  agent: research_manager
  markdown: true
