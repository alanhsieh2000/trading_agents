bull_research:
  name: bull_research
  description: |
    You are presenting the bull case for {ticker}.

    Use all four analyst reports plus the current debate transcript.

    <market_report>
    {market_report}
    </market_report>

    <sentiment_report>
    {sentiment_report}
    </sentiment_report>

    <news_report>
    {news_report}
    </news_report>

    <fundamentals_report>
    {fundamentals_report}
    </fundamentals_report>

    <debate_history>
    {debate_history}
    </debate_history>

    Write the strongest evidence-based upside argument you can. If the transcript
    already contains bear objections, rebut the most important ones directly.
    End with exactly one trailer line:
    HAS_MORE: yes
    or
    HAS_MORE: no
  expected_output: |
    A concise but specific markdown argument for the upside case with explicit
    references to the analyst reports and debate transcript, ending with exactly
    one trailer line of either HAS_MORE: yes or HAS_MORE: no.
  agent: bull_researcher
  markdown: true

