aggressive_risk_analysis:
  name: aggressive_risk_analysis
  description: |
    Your task is to create a compelling case for the trader's decision by questioning and critiquing the conservative and neutral stances to demonstrate why your high-reward perspective offers the best path forward.

    The instrument to analyze is {ticker}. Use this exact ticker in every tool call, report, and recommendation, preserving any exchange suffix (e.g. `.TO`, `.L`, `.HK`, `.T`, `-USD`).

    Incorporate insights from the following sources into your arguments:
    - Market Research Report: {market_research_report}
    - Social Media Sentiment Report: {sentiment_report}
    - Latest World Affairs Report: {news_report}
    - Company Fundamentals Report: {fundamentals_report}
    - Here is the trader's decision: {trader_plan}
    - Here is the current conversation history: {history}
    - Here is the last response from the conservative analyst: {current_conservative_response}
    - Here is the last response from the neutral analyst: {current_neutral_response}

    If there are no responses from the other viewpoints yet, present your own argument based on the available data.
  expected_output: >
    Engage actively by addressing any specific concerns raised, refuting the
    weaknesses in their logic, and asserting the benefits of risk-taking to
    outpace market norms. Maintain a focus on debating and persuading, not just
    presenting data. Challenge each counterpoint to underscore why a high-risk
    approach is optimal. Output conversationally as if you are speaking without
    any special formatting.
  agent: aggressive_analyst
  markdown: false

conservative_risk_analysis:
  name: conservative_risk_analysis
  description: |
    Your task is to actively counter the arguments of the Aggressive and Neutral Analysts, highlighting where their views may overlook potential threats or fail to prioritize sustainability. Respond directly to their points, drawing from the following data sources to build a convincing case for a low-risk approach adjustment to the trader's decision.

    The instrument to analyze is {ticker}. Use this exact ticker in every tool call, report, and recommendation, preserving any exchange suffix (e.g. `.TO`, `.L`, `.HK`, `.T`, `-USD`).

    Incorporate insights from the following sources into your arguments:
    - Market Research Report: {market_research_report}
    - Social Media Sentiment Report: {sentiment_report}
    - Latest World Affairs Report: {news_report}
    - Company Fundamentals Report: {fundamentals_report}
    - Here is the trader's decision: {trader_plan}
    - Here is the current conversation history: {history}
    - Here is the last response from the aggressive analyst: {current_aggressive_response}
    - Here is the last response from the neutral analyst: {current_neutral_response}

    If there are no responses from the other viewpoints yet, present your own argument based on the available data.
  expected_output: >
    Engage by questioning their optimism and emphasizing the potential downsides
    they may have overlooked. Address each of their counterpoints to showcase why
    a conservative stance is ultimately the safest path for the firm's assets.
    Focus on debating and critiquing their arguments to demonstrate the strength
    of a low-risk strategy over their approaches. Output conversationally as if
    you are speaking without any special formatting.
  agent: conservative_analyst
  markdown: false

neutral_risk_analysis:
  name: neutral_risk_analysis
  description: |
    Your task is to challenge both the Aggressive and Conservative Analysts, pointing out where each perspective may be overly optimistic or overly cautious. Use insights from the following data sources to support a moderate, sustainable strategy to adjust the trader's decision.

    The instrument to analyze is {ticker}. Use this exact ticker in every tool call, report, and recommendation, preserving any exchange suffix (e.g. `.TO`, `.L`, `.HK`, `.T`, `-USD`).

    Incorporate insights from the following sources into your arguments:
    - Market Research Report: {market_research_report}
    - Social Media Sentiment Report: {sentiment_report}
    - Latest World Affairs Report: {news_report}
    - Company Fundamentals Report: {fundamentals_report}
    - Here is the trader's decision: {trader_plan}
    - Here is the current conversation history: {history}
    - Here is the last response from the aggressive analyst: {current_aggressive_response}
    - Here is the last response from the conservative analyst: {current_conservative_response}

    If there are no responses from the other viewpoints yet, present your own argument based on the available data.
  expected_output: >
    Engage actively by analyzing both sides critically, addressing weaknesses in
    the aggressive and conservative arguments to advocate for a more balanced
    approach. Challenge each of their points to illustrate why a moderate risk
    strategy might offer the best of both worlds, providing growth potential
    while safeguarding against extreme volatility. Focus on debating rather than
    simply presenting data, aiming to show that a balanced view can lead to the
    most reliable outcomes. Output conversationally as if you are speaking
    without any special formatting.
  agent: neutral_analyst
  markdown: false
